<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect - FirstLine Development</title>
  <meta name="description" content="Connect with FirstLine Development." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#18181B',
              accent: '#2563EB',
              light: '#F4F4F5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    .connect-card {
      max-height: calc(100dvh - 2rem);
    }

    @supports not (height: 100dvh) {
      .connect-card {
        max-height: calc(100vh - 2rem);
      }
    }
  </style>
</head>
<body class="bg-brand-light font-sans text-brand-dark antialiased min-h-screen flex items-center justify-center p-4">
  <div class="fixed inset-0 z-[-1] opacity-[0.05] pointer-events-none" style="background-image: radial-gradient(#18181B 1px, transparent 1px); background-size: 24px 24px;"></div>

  <main class="connect-card w-full max-w-[24.7rem] bg-white rounded-[2rem] shadow-[0_24px_48px_-12px_rgba(0,0,0,0.08)] overflow-hidden border border-slate-200 relative" aria-labelledby="connect-title">
    <div class="h-1.5 w-full bg-brand-accent"></div>

    <div class="p-[1.36rem] pb-[1.8rem]">
      <header class="flex flex-col items-center text-center mb-[1.57rem]">
        <div class="relative mb-4">
          <div class="w-[4.5rem] h-[4.5rem] bg-white rounded-3xl flex items-center justify-center shadow-xl border border-slate-100">
            <img class="w-[3.18rem] h-[3.18rem] object-contain" src="/connect/fl-logo.png" alt="FirstLine Development logo" />
          </div>
          <div class="absolute -bottom-1 -right-1 w-7 h-7 bg-green-500 rounded-full border-[3px] border-white flex items-center justify-center text-[9px]" aria-hidden="true">
            <i class="fa-solid fa-check text-white"></i>
          </div>
        </div>

        <h1 id="connect-title" class="text-2xl font-extrabold tracking-tight text-brand-dark mb-1">FirstLine Development</h1>
        <p class="text-brand-accent font-semibold text-sm tracking-wide uppercase">Websites built for business.</p>

        <div class="mt-[0.9rem] px-[0.9rem] py-[0.66rem] rounded-2xl bg-brand-light border border-slate-200/50 text-sm text-slate-500 leading-snug max-w-[298px]">
          <i class="fa-solid fa-qrcode mr-2 opacity-50 text-xs" aria-hidden="true"></i>
          Scan successful. Connect with our team using the options below.
        </div>
      </header>

      <section class="space-y-[0.79rem]" aria-label="Contact actions">
        <a href="https://firstlinedev.com" target="_blank" rel="noopener noreferrer" class="group relative flex items-center justify-between p-[0.9rem] bg-brand-dark rounded-2xl text-white shadow-lg shadow-brand-dark/10 hover:bg-brand-accent transition-all duration-300">
          <span class="flex items-center gap-4">
            <span class="w-11 h-11 bg-white/10 rounded-xl flex items-center justify-center" aria-hidden="true">
              <i class="fa-solid fa-globe text-lg"></i>
            </span>
            <span>
              <span class="block font-bold text-base">Visit Website</span>
              <span class="block text-xs text-white/60 uppercase tracking-widest font-semibold">firstlinedev.com</span>
            </span>
          </span>
          <span class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center" aria-hidden="true">
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </span>
        </a>

        <div class="grid grid-cols-2 gap-[0.79rem]">
          <a href="tel:+19193075422" class="group flex flex-col items-center justify-center p-[0.9rem] bg-brand-light border border-slate-200 rounded-2xl hover:border-brand-accent hover:bg-white transition-all duration-300">
            <span class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-brand-dark mb-2 shadow-sm group-hover:text-brand-accent" aria-hidden="true">
              <i class="fa-solid fa-phone"></i>
            </span>
            <span class="font-bold text-sm">Call Us</span>
            <span class="text-[10px] text-slate-400 mt-1 uppercase tracking-widest font-bold">Direct</span>
          </a>

          <a href="sms:+19193075422" class="group flex flex-col items-center justify-center p-[0.9rem] bg-brand-light border border-slate-200 rounded-2xl hover:border-brand-accent hover:bg-white transition-all duration-300">
            <span class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-brand-dark mb-2 shadow-sm group-hover:text-brand-accent" aria-hidden="true">
              <i class="fa-solid fa-message"></i>
            </span>
            <span class="font-bold text-sm">Text Us</span>
            <span class="text-[10px] text-slate-400 mt-1 uppercase tracking-widest font-bold">SMS</span>
          </a>
        </div>

        <a href="mailto:firstlinedevnt@gmail.com" class="group flex items-center justify-between p-[0.9rem] bg-brand-light border border-slate-200 rounded-2xl hover:border-brand-accent hover:bg-white transition-all duration-300">
          <span class="flex items-center gap-4 min-w-0">
            <span class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-brand-dark shadow-sm group-hover:text-brand-accent shrink-0" aria-hidden="true">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <span class="min-w-0">
              <span class="block font-bold text-sm text-brand-dark">Send Email</span>
              <span class="block text-xs text-slate-500 truncate">firstlinedevnt@gmail.com</span>
            </span>
          </span>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs mr-1" aria-hidden="true"></i>
        </a>

        <a href="/connect/firstline-contact.vcf" download class="group flex items-center justify-between p-[0.9rem] bg-brand-accent text-white rounded-2xl hover:bg-brand-dark transition-all duration-300">
          <span class="flex items-center gap-4">
            <span class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-white" aria-hidden="true">
              <i class="fa-solid fa-user-plus text-lg"></i>
            </span>
            <span>
              <span class="block font-bold text-sm">Save Contact</span>
              <span class="block text-xs text-white/70">Add to address book</span>
            </span>
          </span>
          <i class="fa-solid fa-download text-white/50 text-xs mr-1" aria-hidden="true"></i>
        </a>
      </section>

      <footer class="mt-[1.57rem] flex flex-col items-center gap-[0.9rem]">
        <div class="flex items-center gap-8 text-slate-400 text-sm" aria-label="Quick links">
          <a href="https://firstlinedev.com" target="_blank" rel="noopener noreferrer" class="hover:text-brand-accent transition-colors" aria-label="Visit FirstLine Development website">
            <i class="fa-solid fa-globe text-lg" aria-hidden="true"></i>
          </a>
          <a href="mailto:firstlinedevnt@gmail.com" class="hover:text-brand-accent transition-colors" aria-label="Email FirstLine Development">
            <i class="fa-solid fa-envelope text-lg" aria-hidden="true"></i>
          </a>
          <a href="tel:+19193075422" class="hover:text-brand-accent transition-colors" aria-label="Call FirstLine Development">
            <i class="fa-solid fa-phone text-lg" aria-hidden="true"></i>
          </a>
        </div>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">&copy; 2026 FirstLine Development</p>
      </footer>
    </div>
  </main>
</body>
</html>
